[package]
name = "fredx"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "FRED 源事实库：系列 ID 常量、源单位、离线解析、fail-closed 授权判定与跨源守卫（不含联网采集）"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bytechainx/fredx"
homepage = "https://github.com/bytechainx/fredx"
documentation = "https://github.com/bytechainx/fredx#readme"
readme = "README.md"
keywords = ["fred", "macro", "source-facts", "offline", "types"]
categories = ["data-structures", "finance"]
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "LICENSE-*",
    "Cargo.toml",
]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[[bench]]
name = "hot_path"
harness = false

[lints.rust]
private_interfaces = "deny"
private_bounds = "deny"
unused_must_use = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
